[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[redirects]]
  from = "/gateway"
  to = "/gateway.html"
  status = 200

[[redirects]]
  from = "/colony"
  to = "/colony.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
